 iconRefresh();
}
function switchView(v){
 currentView=v; pendingDelete=null; navInit(); render();
 $('#sidebar').classList.remove('mobile-open');$('#overlay').classList.remove('show');
}
function calc(){
 const results=state.results||[], regs=state.registrations||[], students=state.students||[];
 const standing=houses.map(h=>{const ids=new Set(students.filter(s=>s.house===h).map(s=>s.id));const rr=results.filter(r=>ids.has(r.studentId));
 return {house:h,gold:rr.filter(r=>r.medal==='Emas').length,silver:rr.filter(r=>r.medal==='Perak').length,bronze:rr.filter(r=>r.medal==='Gangsa').length,points:rr.reduce((a,r)=>a+(+r.points||0),0)}});
 standing.sort((a,b)=>b.gold-a.gold||b.silver-a.silver||b.bronze-a.bronze||b.points-a.points);
 return {standing,active:new Set(regs.map(r=>r.studentId)),completed:state.events.filter(e=>e.status==='Selesai').length};
}
function pageHead(title,desc,actions=''){return `<div class="mb-6 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><p class="mb-1 text-xs font-extrabold uppercase tracking-[.18em] text-[#14718f]">STOS · ${esc(state.settings.activeYear)} · ${esc(state.settings.tournament)}</p><h2 class="font-['Fraunces'] text-3xl font-bold text-[#10243e]">${title}</h2><p class="mt-1 text-slate-500">${desc}</p></div><div class="flex flex-wrap gap-2">${actions}</div></div>`}
const action=(label,icon,act,kind='btn-soft')=>`<button type="button" data-action="${act}" class="btn ${kind}"><i data-lucide="${icon}" class="h-4 w-4"></i>${label}</button>`;
function render(){
 const label=NAV.find(n=>n[0]===currentView)?.[2]||'Dashboard'; $('#view-title').textContent=label;
 const fn={dashboard:renderDashboard,students:renderStudents,events:renderEvents,draw:renderDraw,registration:renderRegistration,judges:renderJudges,winners:renderWinners,standings:renderStandings,records:renderRecords,analysis:renderAnalysis,settings:renderSettings,archive:renderArchive}[currentView];
 $('#view').innerHTML=fn(); bindView(); iconRefresh();
}
function renderDashboard(){
 const c=calc(), total=state.students.length, completed=c.completed;
 return `${pageHead('Pusat Kawalan Kejohanan SKDB','Ringkasan langsung prestasi, penyertaan dan kemajuan acara.')}
 <section class="hero-image relative mb-6 overflow-hidden rounded-[28px] bg-[#09243b] text-white shadow-xl">

  <div class="relative flex min-h-[310px] max-w-2xl flex-col justify-end p-7 md:p-10">
   <span class="mb-4 w-fit rounded-full bg-[#e4aa36] px-3 py-1 text-xs font-extrabold uppercase tracking-widest text-[#09243b]">Sesi ${state.settings.activeYear}</span>
   <h3 class="font-['Fraunces'] text-3xl font-bold md:text-5xl">${esc(state.settings.tournament)}</h3>
   <p class="mt-3 text-white/75">${esc(state.settings.school)} · Semangat Kesukanan, Kecemerlangan Bersama</p>
   <div class="flex items-center gap-3 mt-5">
    <button type="button" data-action="banner-upload-trigger" class="btn bg-white text-[#09243b]"><i data-lucide="upload"></i>Muat Naik Banner</button>
    <input id="banner-file-input" type="file" accept="image/*" class="hidden">
    <button data-action="banner-help" class="btn btn-soft !bg-white/20 text-white"><i data-lucide="help-circle"></i>Info</button>
   </div>
  </div>
 </section>
 <div class="mb-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-6">
 ${[['Murid',total,'users'],['Atlet Aktif',c.active.size,'person-standing'],['Jumlah Acara',state.events.length,'trophy'],['Acara Selesai',completed,'check-circle'],['Rekod Baharu',state.results.filter(r=>r.status==='RB').length,'sparkles'],['Rumah Mendahului',c.standing[0]?.house||'-','flag']].map((x,i)=>`<article class="panel p-5"><div class="mb-4 flex h-10 w-10 items-center justify-center rounded-xl ${i===4?'bg-amber-100 text-amber-700':'bg-cyan-50 text-cyan-700'}"><i data-lucide="${x[2]}"></i></div><p class="text-2xl font-extrabold">${esc(x[1])}</p><p class="text-sm text-slate-500">${x[0]}</p></article>`).join('')}
 </div>
 <div class="grid gap-6 xl:grid-cols-[1.35fr_.65fr]">
  <section class="panel overflow-hidden"><div class="flex items-center justify-between p-5"><h3 class="font-extrabold">Kedudukan Pingat Rumah</h3>${action('Lihat Penuh','arrow-right','go-standings')}</div>${standingTable(c.standing)}</section>

function standingTable(rows){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Rumah</th><th>Emas</th><th>Perak</th><th>Gangsa</th><th>Mata</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="font-extrabold">${i+1}</td><td><span class="badge" style="color:${houseStyle[r.house][0]};background:${houseStyle[r.house][1]}">${r.house}</span></td><td>${r.gold}</td><td>${r.silver}</td><td>${r.bronze}</td><td class="font-extrabold">${r.points}</td></tr>`).join('')}</tbody></table></div>`}
function renderStudents() {
  let rows = state.students.filter(s => (filters.house === 'Semua' || s.house === filters.house) && (`${s.name} ${s.bib} ${s.className}`.toLowerCase().includes(filters.search.toLowerCase())));
  
  // Calculate registration status summary for each student
  const studentsWithRegStats = rows.map(s => {
    const studentRegs = state.registrations.filter(r => r.studentId === s.id);
    const indCount = studentRegs.filter(r => {
      const ev = state.events.find(e => e.id === r.eventId);
      return ev && !['Relay', 'Merentas Desa'].includes(ev.type);
    }).length;
    
    const relayCount = studentRegs.filter(r => {
      const ev = state.events.find(e => e.id === r.eventId);
      return ev && ev.type === 'Relay';
    }).length;
    
    const xcCount = studentRegs.filter(r => {
      const ev = state.events.find(e => e.id === r.eventId);
      return ev && ev.type === 'Merentas Desa';
    }).length;

    // Check for "Borrowed" categories (where student's category differs from registered event's category)
    const borrowedCategories = [];
    studentRegs.forEach(r => {
      const ev = state.events.find(e => e.id === r.eventId);
      if (ev && ev.category && ev.category !== s.category) {
        borrowedCategories.push(`${ev.no} (${ev.category})`);
      }
    });

    return {
      ...s,
      indCount,
      relayCount,
      xcCount,
      borrowedInfo: borrowedCategories.length > 0 ? borrowedCategories.join(', ') : null
    };
  });

function eventRegs(e){return state.registrations.filter(r=>r.eventId===e.id).map(r=>state.students.find(s=>s.id===r.studentId)).filter(Boolean)}
function fairShuffle(items){
 const shuffled=[...items];
 for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
 return shuffled;
}
function laneParticipants(e){

 if(current?.length)return current.map(id=>state.students.find(s=>s.id===id)).filter(Boolean);
 return eventRegs(e);
}
function createLaneDraw(e){

 if(lanes===3) ordered=fairShuffle(participants).slice(0,3);
 else {
  const byHouse={}; participants.forEach(s=>(byHouse[s.house] ||= []).push(s));
  const housesWithAthletes=Object.values(byHouse).filter(x=>x.length);
  const set1=housesWithAthletes.map(x=>x[0]);
  const set2=housesWithAthletes.map(x=>x[1]).filter(Boolean);
  ordered=[...fairShuffle(set1),...fairShuffle(set2)].slice(0,lanes);
 }

 state.settings.laneDraws[e.id]=ordered.map(s=>s.id);
 return ordered;
}

function competitionSummary(c){

 results.forEach(r=>{if(r.medal&&medals[r.medal]!==undefined)medals[r.medal]++});

 return {id:c.id,name:c.name,year:c.year,status:c.status||'Aktif',students:students.length,events:events.length,registrations:registrations.length,results:results.length,gold:medals.Emas,silver:medals.Perak,bronze:medals.Gangsa,points};
}

async function importStudents(ev){
 const file=ev.target.files[0];if(!file)return;try{const buf=await file.arrayBuffer(),book=XLSX.read(buf),rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);let added=0, skipped=0;
 rows.forEach(r=>{
  const name=r['Nama']||r.Nama||r.Name||r.student_name||r['Nama Murid']||r.nama_murid;
  const genderRaw=r['Jantina']||r.Jantina||r.Gender||r.gender;
  let gender='Lelaki';
  if(genderRaw){
   const g=String(genderRaw).trim().toUpperCase();
   if(g==='P' || g==='PEREMPUAN') gender='Perempuan';
  }
  const className=r['Kelas']||r.Kelas||r.Class||r.class_name||r.kelas||'-';
  const categoryRaw=r['KATEGORI ASAL']||r['Kategori Asal']||r['Kategori']||r.category||r.kategori||'';
  const house=r['Rumah Sukan']||r['RUMAH']||r['Rumah']||r.Rumah||r.House||r.rumah_sukan||r.rumah||r.rumah_suakan;
  if(!name||!house)return;
  const cleanName=String(name).trim();
  const isDuplicate=state.students.some(x=>x.name.toLowerCase()===cleanName.toLowerCase());
  if(isDuplicate){ skipped++; return; }
  const normalizedHouse=String(house).trim().toLowerCase();
  const matchedHouse=houses.find(h=>h.toLowerCase()===normalizedHouse)||houses.find(h=>h.toLowerCase().startsWith(normalizedHouse))||String(house).trim();
  const importedCategory=String(categoryRaw).trim().toUpperCase();
  const cat=importedCategory || (gender==='Lelaki'?'L12':'P12');
  const importedStudent={id:uid('s'),bib:nextBib(matchedHouse),name:cleanName,gender,className:String(className).trim(),category:cat,house:matchedHouse,status:'Aktif'};
  state.students.push(importedStudent);
  autoRegisterCrossCountry(importedStudent);
  added++
 });await saveTypes(['students','registrations']);
 if(skipped>0){
  toast(`${added} murid diimport, ${skipped} pendua diabaikan.`);
 } else {
  toast(`${added} murid berjaya diimport.`);
 }
 render()}catch{toast('Fail tidak dapat dibaca. Semak format Excel.','error')}finally{ev.target.value=''}
}
async function importEvents(ev){
 const file=ev.target.files[0];if(!file)return;try{const buf=await file.arrayBuffer(),book=XLSX.read(buf),rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]);let added=0;
 rows.forEach(r=>{
  const name=r['Nama Acara']||r['NAMA ACARA']||r.Name||r.Acara||r.nama_acara||r['NAMA']||r.NAMA;
  const no=r['No Acara']||r['NO ACARA']||r.No||r.Number||r['NO']||r.no;
  if(!name||!no)return;
  const rawType = String(r['JENIS']||r.Jenis||r.Type||'Balapan').trim().toUpperCase();
  let type = 'Balapan';
  if (rawType.includes('PADANG')) type = 'Padang';
  else if (rawType.includes('MERENTAS') || rawType.includes('DESA')) type = 'Merentas Desa';
  else if (rawType.includes('RELAY') || rawType.includes('KUMPULAN')) type = 'Relay';

  state.events.push({id:uid('e'),no:String(no).trim(),name:String(name).trim(),category:String(r['KATEGORI']||r.Kategori||r.Category||'L12').trim(),type,round:String(r['PUSINGAN']||r.Pusingan||r.Round||'Akhir').trim(),status:'Belum Mula',record:0,unit:type==='Padang'?'m':'s'});
  added++
 });await saveTypes(['events']);toast(`${added} acara berjaya diimport.`);render()}catch{toast('Fail tidak dapat dibaca. Semak format Excel.','error')}finally{ev.target.value=''}
}
function exportExcel(kind){
  let data = [];
  let filename = `SKSTOS_${String(state.settings.tournament||'Kejohanan').replace(/[^a-z0-9_-]+/gi,'_')}_${state.settings.activeYear}`;
  
  if (kind === 'export-events') {
    filename = `Master_Acara_${state.settings.activeYear}`;
    data = state.events.map(e => ({
      'No Acara': e.no,
      'Nama Acara': e.name,
      'Kategori': e.category,
      'Jenis': e.type,
      'Pusingan': e.round,
      'Status': e.status
    }));
  } else if (kind === 'export-analysis') {
    filename = `Kedudukan_Rumah_Sukan_${state.settings.activeYear}`;
    const c = calc();
    data = c.standing.map((r, i) => ({
      'Kedudukan': i + 1,
      'Rumah Sukan': r.house,
      'Emas': r.gold,
      'Perak': r.silver,
      'Gangsa': r.bronze,
      'Jumlah Mata': r.points
    }));
  } else if (kind === 'export-students') {
    filename = `Master_Murid_${state.settings.activeYear}`;
    data = state.students.map(s => {
      const regs = state.registrations.filter(r => r.studentId === s.id);
      return {
        'No Bib': s.bib,
        'Nama Murid': s.name,
        'Jantina': s.gender,
        'Kelas': s.className,
        'Kategori': s.category,
        'Rumah Sukan': s.house,
        'Jumlah Acara Didaftar': regs.length
      };
    });
  } else {
    data = state.students;
  }
  
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data_SKSTOS');
  XLSX.writeFile(wb, `${filename}.xlsx`);
}

function makeJudgeFormPdf(e){
  const popup = window.open('', '_blank');
  if (!popup) { toast('Sila benarkan pop-up untuk mencetak borang.', 'error'); return; }
  const escPrint = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const participants = laneParticipants(e);
  const isField = e.type === 'Padang';
  const isRelay = e.type === 'Relay';
  const headers = isField

 // Save historical records from form state inputs
 const historicalRecords = [];
 document.querySelectorAll('#historical-tbody tr').forEach(tr => {
   const y = tr.querySelector('.hist-year')?.value.trim();
   const no = tr.querySelector('.hist-no')?.value.trim();
   const name = tr.querySelector('.hist-name')?.value.trim();
   const cat = tr.querySelector('.hist-cat')?.value.trim();
   const holder = tr.querySelector('.hist-holder')?.value.trim();
   const val = tr.querySelector('.hist-val')?.value.trim();
   if(y || name || holder) {
     historicalRecords.push({year:y || '2022', no:no || '', name:name || '', category:cat || '', holder:holder || '', value:val || ''});
   }
 });
 state.settings.historicalRecords = historicalRecords;

 // Keep uploaded branding in the settings dataset so it persists in the Google Sheets.
 state.settings.logo = state.settings.logo || null;

 state.settings.activeYear=String(year); const activeComp=getActiveCompetition(); if(activeComp){activeComp.year=String(year);activeComp.name=state.settings.tournament;}
 await saveTypes(['competitions','settings','students','events','registrations','results']);setupCompetitions();setupYears();
 const schoolLabel = $('[data-template-id="school-name"]');
 if (schoolLabel) { schoolLabel.textContent = state.settings.school; schoolLabel.innerHTML = esc(state.settings.school); }
 render();
}
function setBusy(on){busy=on;document.querySelectorAll('button').forEach(b=>b.disabled=on);$('#sync-status').textContent=on?'Menyimpan…':'Disimpan';$('#sync-status').className=`hidden rounded-full px-3 py-2 text-xs font-bold md:inline-flex ${on?'bg-amber-50 text-amber-700':'bg-emerald-50 text-emerald-700'}`}

const GOOGLE_SHEETS_API = 'https://script.google.com/macros/s/AKfycbyskxCngO_Ebzj582rrMJElulXdPTZKfCfkeDa4ITJ6DMdoABMVDjg1dAZaBLiZYD8H/exec';

// Sambungan GitHub Pages -> Google Apps Script menggunakan JSONP untuk GET
// dan hidden form POST untuk elak masalah CORS / "Failed to fetch".
async function apiGet() {
  if (!GOOGLE_SHEETS_API || GOOGLE_SHEETS_API.includes('PASTE_APPS_SCRIPT')) {
    throw new Error('URL Google Apps Script belum ditetapkan.');
  }

  const res = await fetch(`${GOOGLE_SHEETS_API}?action=read&_=${Date.now()}`, {
    method: 'GET',
    redirect: 'follow',
    credentials: 'include',
    cache: 'no-store'
  });

  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || 'Gagal membaca Google Sheets.');
  }

  return json.records || [];
}

async function apiPost(payload) {
  if (!GOOGLE_SHEETS_API || GOOGLE_SHEETS_API.includes('PASTE_APPS_SCRIPT')) {
    throw new Error('URL Google Apps Script belum ditetapkan.');
  }

  const res = await fetch(GOOGLE_SHEETS_API, {
    method: 'POST',
    redirect: 'follow',
    credentials: 'include',
    cache: 'no-store',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  const json = await res.json();

  if (!json.ok) {
    throw new Error(json.error || 'Gagal menyimpan ke Google Sheets.');
  }

  return json;
}

function defaultCompetitionId(year){return `KJ-${year}-001`;}
function normalizeRecords(data){
 return (Array.isArray(data)?data:[]).map(r=>({...r,competition_id:r.competition_id || defaultCompetitionId(r.year)}));
}
function getActiveCompetition(){
 return (state.competitions||[]).find(c=>c.id===state.settings.activeCompetitionId) || state.competitions?.[0];
}
function loadCompetitionIntoState(){
 const c=getActiveCompetition();
 if(!c)return;
 state.settings.activeCompetitionId=c.id;
 state.settings.activeYear=String(c.year);
 const cid=c.id;
 const settingsRec=records.find(r=>r.type==='settings' && r.competition_id===cid);
 if(settingsRec){
   try{state.settings=JSON.parse(settingsRec.data);state.settings.activeCompetitionId=cid;state.settings.activeYear=String(c.year);}
   catch(e){console.error('Gagal parse settings:',e);}
 }
 else{
   state.settings={...state.settings,activeCompetitionId:cid,activeYear:String(c.year),tournament:c.name};
   state.students=[];state.events=[];state.registrations=[];state.results=[];state.activities=[];state.recycleBin=[];
 }
 ['students','events','registrations','results'].forEach(type=>{
   const r=records.find(x=>x.type===type && x.competition_id===cid);
   if(r){try{state[type]=JSON.parse(r.data)}catch{state[type]=[]}}else state[type]=[];
 });
 ['activities','recycleBin'].forEach(type=>{
   const r=records.find(x=>x.type===type && x.competition_id===cid);
   if(r){try{state[type]=JSON.parse(r.data)}catch{state[type]=[]}}else state[type]=[];
 });
 if(state.settings.houses)houses=state.settings.houses;
 if(state.settings.houseStyles)houseStyle=state.settings.houseStyles;
}
function applyRemoteRecords(data) {
 records=normalizeRecords(data);

 const compRec=records.find(r=>r.type==='competitions' && String(r.year)==='ALL');
 if(compRec){
   try{state.competitions=JSON.parse(compRec.data)||[]}catch{state.competitions=[]}
 } else {
   const ids=[...new Set(records.filter(r=>r.type==='settings').map(r=>r.competition_id))];
   state.competitions=ids.map((id,i)=>{
     const r=records.find(x=>x.type==='settings'&&x.competition_id===id);
     let s={};try{s=JSON.parse(r?.data||'{}')}catch{}
     return {id,name:s.tournament||`Kejohanan ${r?.year||''}`,year:String(r?.year||'2026'),status:'Aktif'};
   });
 }
 if(!state.competitions.length){
   state.competitions=[{id:defaultCompetitionId('2026'),name:'Kejohanan Olahraga Tahunan',year:'2026',status:'Aktif',created_at:now()}];
 }
 if(!state.settings.activeCompetitionId || !state.competitions.some(c=>c.id===state.settings.activeCompetitionId)){
   state.settings.activeCompetitionId=state.competitions[0].id;
 }
 loadCompetitionIntoState();
 setupCompetitions();setupYears();updateLogos();
 $('#sync-status').textContent='Google Sheets disambungkan';
 const schoolLabel=$('[data-template-id="school-name"]');
 if(schoolLabel&&state.settings.school){schoolLabel.textContent=state.settings.school;schoolLabel.innerHTML=esc(state.settings.school);}
 render();
}

async function saveTypes(types){
 if(busy)return false;
 setBusy(true);
 try{
  for(const type of types){
   const isGlobal=type==='competitions';
   const year=isGlobal?'ALL':state.settings.activeYear;
   const competition_id=isGlobal?'GLOBAL':state.settings.activeCompetitionId;
   const record={type,year,competition_id,data:JSON.stringify(state[type]??[]),updated_at:now()};
   const existing=records.find(r=>r.type===type&&String(r.year)===String(year)&&String(r.competition_id||'')===String(competition_id));
   if(existing){record.id=existing.id;record.created_at=existing.created_at||now();}
   else record.created_at=now();
   await apiPost({action:'upsert',record});
  }
  const fresh=await apiGet();
  applyRemoteRecords(fresh);
  toast('Perubahan disimpan ke Google Sheets.');
  return true;
 }catch(err){
  console.error('SAVE ERROR:',err);
  toast('Gagal menyimpan ke Google Sheets: '+err.message,'error');
  return false;
 }finally{setBusy(false)}
}

function setupCompetitions(){
 const el=$('#competition-select');if(!el)return;
 const list=(state.competitions||[]).slice().sort((a,b)=>String(a.year).localeCompare(String(b.year))||a.name.localeCompare(b.name));
 el.innerHTML=list.map(c=>`<option value="${esc(c.id)}" ${c.id===state.settings.activeCompetitionId?'selected':''}>${esc(c.year)} · ${esc(c.name)}${c.status==='Selesai'?' · ✓':''}</option>`).join('');
}
function setupYears(){
 const years=[...new Set((state.competitions||[]).map(c=>String(c.year)))].sort();
 $('#year-select').innerHTML=years.map(y=>`<option ${String(y)===String(state.settings.activeYear)?'selected':''}>${y}</option>`).join('');
}

function updateLogos(){
 const sidebarLogo=$('#sidebar-logo-container');
 const headerLogo=$('#header-logo-container');
 if(state.settings.logo){
  if(sidebarLogo) sidebarLogo.innerHTML=`<img src="${state.settings.logo}" class="h-full w-full object-cover">`;
  if(headerLogo) headerLogo.innerHTML=`<img src="${state.settings.logo}" class="h-full w-full object-cover">`;
 } else {
  if(sidebarLogo) sidebarLogo.innerHTML=`<span id="sidebar-logo-text">SK</span>`;
  if(headerLogo) headerLogo.innerHTML=`<i id="header-logo-placeholder" data-lucide="trophy" class="h-5 w-5 text-amber-600"></i>`;
  iconRefresh();
 }
}

async function init(){
  navInit();
  setupCompetitions();
  setupYears();
  updateLogos();
  render();
  iconRefresh();

  const bannerEl = $('#dashboard-banner');
  if(bannerEl) bannerEl.src = state.settings.banner || '';

  try {
    const data = await apiGet();
    applyRemoteRecords(data);
  } catch (err) {
    console.error('LOAD ERROR:', err);
    $('#sync-status').textContent = 'Google Sheets belum disambungkan';
    toast('Google Sheets tidak dapat disambungkan: ' + err.message, 'error');

    state.students = [];
    state.events = [];
    state.registrations = [];
    state.results = [];
    state.activities = [];
    state.recycleBin = [];
    updateLogos();
    render();
  }
}

$('#collapse-btn').onclick=()=>{$('#sidebar').classList.toggle('is-collapsed');$('#main-area').classList.toggle('is-wide')};
$('#menu-btn').onclick=()=>{$('#sidebar').classList.toggle('mobile-open');$('#overlay').classList.toggle('show')};
$('#overlay').onclick=()=>{$('#sidebar').classList.remove('mobile-open');$('#overlay').classList.remove('show')};
$('#modal-close').onclick=closeModal;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#competition-select').onchange=async e=>{
 const id=e.target.value;if(!id||id===state.settings.activeCompetitionId)return;
 state.settings.activeCompetitionId=id;
 loadCompetitionIntoState();setupCompetitions();setupYears();currentView='dashboard';navInit();render();
};
$('#year-select').onchange=e=>{
 const y=String(e.target.value);
 const c=(state.competitions||[]).find(x=>String(x.year)===y);
 if(c){state.settings.activeCompetitionId=c.id;loadCompetitionIntoState();setupCompetitions();setupYears();currentView='dashboard';navInit();render();}
};
init();
</script>
